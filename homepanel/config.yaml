name: Home Panel
version: "0.2.0"
slug: homepanel
description: Pannello minimale per controllare entita Home Assistant
url: "https://example.local"
arch:
  - amd64
  - aarch64
  - armv7
  - i386
  - armhf

startup: application
boot: auto
init: false

homeassistant_api: true
hassio_api: true

# Ingress: comodo per aprirlo dalla sidebar di Home Assistant.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-assistant
panel_title: Home Panel

# Porta esposta: comoda se vuoi metterlo dietro Cloudflare Access / reverse proxy.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Interfaccia web Home Panel

options:
  title: "Controlli Casa"
  ha_token: ""
  require_cloudflare_user: false
  allowed_users:
    - "gianluca@example.com"
  entities:
    - name: "Cancello"
      entity_id: "button.cancello"
      domain: "button"
      action: "press"
      icon: "gate"
      color: "primary"
      confirm: true

    - name: "Garage"
      entity_id: "cover.garage"
      domain: "cover"
      action: "open"
      icon: "garage"
      color: "primary"
      confirm: true

    - name: "Porta di casa"
      entity_id: "lock.porta_di_casa"
      domain: "lock"
      action: "unlock"
      icon: "home"
      color: "danger"
      confirm: true

    - name: "Luce ingresso"
      entity_id: "light.ingresso"
      domain: "light"
      action: "toggle"
      icon: "light"
      color: "warning"
      confirm: false

schema:
  title: str
  ha_token: password
  require_cloudflare_user: bool
  allowed_users:
    - str
  entities:
    - name: str
      entity_id: str
      domain: str
      action: str
      icon: str?
      color: str?
      confirm: bool?
