name: Home Panel
version: "0.1.0"
slug: homepanel
description: Pannello minimale per controllare entita Home Assistant
url: "https://example.local"
arch:
  - aarch64
  - amd64
  - armv7
  - i386

startup: application
boot: auto
init: false

homeassistant_api: true

ingress: true
ingress_port: 8099
panel_icon: mdi:home-assistant
panel_title: Home Panel

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Interfaccia web Home Panel, utile per Cloudflare Access

options:
  title: "Controlli Casa"
  allowed_users:
    - "gianluca@example.com"

  entities:
    - name: "Cancello"
      entity_id: "button.cancello"
      domain: "button"
      action: "press"
      icon: "🚪"
      color: "primary"
      confirm: true

    - name: "Garage"
      entity_id: "cover.garage"
      domain: "cover"
      action: "open"
      icon: "🚗"
      color: "primary"
      confirm: true

    - name: "Porta di casa"
      entity_id: "lock.porta_di_casa"
      domain: "lock"
      action: "unlock"
      icon: "🏠"
      color: "danger"
      confirm: true

    - name: "Luce ingresso"
      entity_id: "light.ingresso"
      domain: "light"
      action: "toggle"
      icon: "💡"
      color: "warning"
      confirm: false

    - name: "Luce garage"
      entity_id: "light.garage"
      domain: "light"
      action: "toggle"
      icon: "💡"
      color: "warning"
      confirm: false

schema:
  title: str
  allowed_users:
    - str
  entities:
    - name: str
      entity_id: str
      domain: str
      action: str
      icon: str?
      color: str?
      confirm: bool?