name: Home Panel
version: "0.7.7"
slug: homepanel
description: Pannello telecomando minimale per Home Assistant e Domoticz con gruppi, permessi utenti e Cloudflare Access
arch:
  - amd64
  - aarch64
  - armv7
  - i386
  - armhf

startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:gesture-tap-button
panel_title: Home Panel

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Interfaccia web Home Panel

options:
  title: "Controlli Casa"
  ha_url: "http://homeassistant:8123/api"
  ha_token: ""
  domoticz_url: "http://domoticz:8080"
  domoticz_username: ""
  domoticz_password: ""
  require_cloudflare_user: true

  allowed_users:
    - "gianluca@gmail.com"

  entities:
    - name: "Luce Campo"
      backend: "homeassistant"
      entity_id: "light.sonoff_stalla_luce_campo"
      domain: "light"
      action: "toggle"
      group: "Stalla Cavallo"
      icon: "light"
      color: "warning"
      confirm: false
      show_state: true
      users:
        - "*"

    - name: "Esempio Domoticz"
      backend: "domoticz"
      entity_id: "domoticz_123"
      idx: 123
      action: "toggle"
      group: "Domoticz"
      icon: "switch"
      color: "primary"
      confirm: false
      show_state: true
      users:
        - "*"

schema:
  title: str
  ha_url: str
  ha_token: str
  domoticz_url: str
  domoticz_username: str
  domoticz_password: str
  require_cloudflare_user: bool

  allowed_users:
    - str

  entities:
    - name: str
      backend: str?
      entity_id: str
      idx: int?
      domain: str?
      action: str
      group: str?
      icon: str?
      color: str?
      confirm: bool?
      show_state: bool?
      users:
        - str
