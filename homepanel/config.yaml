name: Home Panel
version: "0.6.6"
slug: homepanel
description: Pannello telecomando minimale per Home Assistant con gruppi, permessi utenti e Cloudflare Access
arch:
  - amd64
  - aarch64
  - armv7
  - i386
  - armhf

startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:gesture-tap-button
panel_title: Home Panel

ports:
  8099/tcp: 8099

ports_description:
  8099/tcp: Interfaccia web Home Panel

options:
  title: "Controlli Casa"
  ha_url: "http://homeassistant:8123/api"
  ha_token: ""
  require_cloudflare_user: true

  allowed_users:
    - "gianluca@gmail.com"

  entities:
    - name: "Luce Campo"
      entity_id: "light.sonoff_stalla_luce_campo"
      domain: "light"
      action: "toggle"
      group: "Stalla Cavallo"
      icon: "light"
      color: "warning"
      confirm: false
      show_state: true
      users:
        - "*"

schema:
  title: str
  ha_url: str
  ha_token: str
  require_cloudflare_user: bool

  allowed_users:
    - str

  entities:
    - name: str
      entity_id: str
      domain: str
      action: str
      group: str?
      icon: str?
      color: str?
      confirm: bool?
      show_state: bool?
      users:
        - str
