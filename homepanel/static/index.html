<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Home Panel Telecomando</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="static/homepanel-v04.css?v=0.4.0">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1 id="title">Controlli Casa</h1>
        <p id="user" class="subtitle"></p>
      </div>
      <button id="refreshBtn" class="refresh-button" type="button">Aggiorna</button>
    </header>

    <section id="statusBox" class="toast hidden"></section>
    <section id="entities" class="entities"></section>

    <section class="audit-section">
      <div class="audit-header">
        <h2>Ultime azioni</h2>
        <button id="auditBtn" class="mini-button" type="button">Mostra</button>
      </div>
      <div id="auditList" class="audit-list hidden"></div>
    </section>
  </main>
  <script src="static/homepanel-v04.js?v=0.4.0"></script>
</body>
</html>
